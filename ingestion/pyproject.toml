[project]
name = "conveyer-ingestion"
version = "0.1.0"
description = "Conveyer data ingestion module — delivery ledger, registration, s3-push / sftp-pull drivers, absence detection. Build spec: design/002.1_data_ingestion_lld.md."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
    "pyiceberg[glue,pyarrow]>=0.7",
    "paramiko>=3.4",
    "PyYAML>=6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "moto[s3,dynamodb,events,secretsmanager]>=5",
    "ruff",
    "mypy",
    "sqlalchemy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ingestion", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["ingestion"]

# Strict on the pure core (LLD §12.6). mypy's `strict` flag is global-only, so
# the per-module equivalent is spelled out.
[[tool.mypy.overrides]]
module = "ingestion.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# LLD §12.5 coverage gate: core/ >= 95% branch; overall >= 85%. `make coverage`
# (Makefile) runs the suite with `branch = true` in effect, then checks both
# thresholds via two separate `coverage report --fail-under=...` calls (one
# bare, one `--include='ingestion/core/*'`) against the SAME collected data.
[tool.coverage.run]
branch = true
source = ["ingestion"]
# "Adapters excluded from the gate only where moto cannot simulate (document
# each exclusion inline)" -- `effects/sftp.py`'s own module docstring already
# documents that real paramiko/SFTP has no moto counterpart and therefore no
# `tests/integration` file exists for it (covered instead by the in-memory
# `SftpFx` test double used throughout the golden suite). This is the one
# module-wide (not just a few lines) case; every other partially-untestable
# adapter (e.g. `effects/ledger.py`'s glue-catalog branch, `maintenance/
# optimize.py`'s real Athena calls) is mostly test-covered and stays IN the
# gate, so a regression there still fails the build.
omit = ["ingestion/effects/sftp.py"]

[tool.coverage.report]
precision = 1
show_missing = true
